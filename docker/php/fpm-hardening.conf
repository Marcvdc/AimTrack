; FPM-pool-hardening voor de production-image (alleen de webrequests).
;
; Bewust een pool-config en geen globale ini: dezelfde image draait ook de CLI
; (queue:work, artisan, de entrypoint). Symfony Process gebruikt proc_open, en
; een disable_functions in conf.d zou die kant breken. php_admin_* kan de
; applicatie niet met ini_set() terugdraaien.
;
; De webkant heeft geen van deze functies nodig: uitgaande HTTP (Anthropic,
; Copilot, Sentry) loopt via Guzzle met ext-curl, dompdf leest alleen lokale
; bestanden, mail gaat via SMTP-sockets en MIME-detectie via ext-fileinfo.

[www]
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_flag[allow_url_fopen] = off
