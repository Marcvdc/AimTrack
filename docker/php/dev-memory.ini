; Geheugenlimiet voor het dev-target (issue #167). Niet in de production-image.
;
; De PHP-standaard van 128M is te krap voor de testsuite: Pest valt om zodra hij
; Filament- en Livewire-componenten rendert. `php -d memory_limit=...` helpt bij
; `php artisan test` niet, omdat dat een subproces start dat php.ini opnieuw leest.
; Daarom staat de limiet hier, in conf.d, waar elk PHP-proces in de container hem ziet.
;
; Bewust een vaste ruime waarde en geen -1: een echt geheugenlek moet nog steeds
; vastlopen in plaats van de container leeg te trekken. De CI zet dezelfde waarde
; (.github/workflows/ci.yml), zodat lokaal en CI hetzelfde meten.
;
; Production houdt de standaard van php.ini-production (128M). Een webrequest dat
; daar overheen gaat is een bug die we willen zien, geen reden om de grens op te
; rekken. Zie docs/local-dev-wsl.md.

memory_limit = 512M
