server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Security headers (#130). Alleen hier op server-niveau: een add_header in
    # een location schakelt in nginx alle headers hieronder uit voor die
    # location. HSTS staat bij de TLS-proxy (Caddy), de origin doet alleen HTTP.
    # De CSP draait voorlopig report-only. De webfonts staan sinds #128 onder
    # public/webfonts, dus style-src en font-src hebben geen externe host nodig.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    client_max_body_size 20M;

    root /var/www/html/public;
    index index.php;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ^~ /livewire {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(jpg|jpeg|gif|png|svg|ttf|otf|woff|woff2|css|js)$ {
        try_files $uri $uri/ /index.php?$query_string;
        expires 30d;
        access_log off;
        log_not_found off;
    }
}
